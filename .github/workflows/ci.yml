name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # pnpm builds a git dependency inside its store, under a node_modules folder, where tsc once failed with TS2742.
      - name: Build the types from inside a node_modules folder
        run: |
          mkdir -p "$RUNNER_TEMP/node_modules"
          cp -R . "$RUNNER_TEMP/node_modules/refine-ui"
          cd "$RUNNER_TEMP/node_modules/refine-ui"
          pnpm exec tsc -p tsconfig.build.json --outDir "$RUNNER_TEMP/types"
      - run: pnpm build-storybook --quiet
